<!DOCTYPE html>
<html>
<head>
    <title>Ship Positions</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([-37.814, 144.96332], 12);  // Centered on Melbourne

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var shipMarkers = {};

        async function fetchPositions() {
            const response = await fetch('/positions');
            const positions = await response.json();
            return positions;
        }

        async function updateMap() {
            const positions = await fetchPositions();
            for (const [shipId, pos] of Object.entries(positions)) {
                if (shipMarkers[shipId]) {
                    shipMarkers[shipId].setLatLng([pos.latitude, pos.longitude]);
                } else {
                    shipMarkers[shipId] = L.marker([pos.latitude, pos.longitude]).addTo(map)
                        .bindPopup(`Ship ID: ${shipId}`);
                }
            }
        }

        setInterval(updateMap, 10000); // Update every 10 seconds
    </script>
</body>
</html>
